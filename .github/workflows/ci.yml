name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knn
          POSTGRES_PASSWORD: knn_local_dev_pw
          POSTGRES_DB: knn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knn -d knn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Bootstrap app DB role (required for RLS)
        run: pnpm db:bootstrap

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    # Playwright auth-flow smoke (web-only — the dashboard's auth gate treats a missing API
    # session as anon and redirects to /login, so no DB/API/Redis services are needed here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install Playwright browser
        run: pnpm --filter @knn/web exec playwright install --with-deps chromium
      - name: E2E (auth-flow smoke)
        run: pnpm --filter @knn/web e2e
