# Staging/production stack for a single Hetzner box.
# Build once into `knn-app:latest`; run each app as its own container from it.
# Caddy terminates TLS (auto Let's Encrypt) for the three domains. Postgres and
# Redis are NOT published — only Caddy is exposed (80/443).
#
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging up -d --build
#
# Caddy lives behind the `edge` profile so local verification can skip it
# (no public DNS): add `--profile edge` on the real box.
name: knn-staging

x-app: &app
  image: knn-app:latest
  env_file: [.env.staging]
  working_dir: /repo
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - knn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - knn_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  # One-shot: apply migrations, provision the RLS app role, seed. Runs to
  # completion before the apps start.
  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Baked into the article (Next) build — AFS only serves on approved domains.
        NEXT_PUBLIC_AFS_PUB_ID: ${NEXT_PUBLIC_AFS_PUB_ID:-}
        NEXT_PUBLIC_AFS_STYLE_ID: ${NEXT_PUBLIC_AFS_STYLE_ID:-}
    restart: 'no'
    command: ['sh', '-lc', 'pnpm db:deploy && pnpm db:bootstrap && pnpm db:seed']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'apps/api/dist/index.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3000/health/live').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  redirect:
    <<: *app
    command: ['node', 'apps/redirect/dist/index.js']
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', 'apps/worker/dist/index.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ['pnpm', '--filter', '@knn/web', 'start']

  article:
    <<: *app
    command: ['pnpm', '--filter', '@knn/article', 'start']

  caddy:
    image: caddy:2
    profiles: ['edge']
    restart: unless-stopped
    env_file: [.env.staging]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - knn_caddydata:/data
      - knn_caddyconfig:/config
    depends_on:
      - api
      - web
      - article
      - redirect

volumes:
  knn_pgdata: {}
  knn_redisdata: {}
  knn_caddydata: {}
  knn_caddyconfig: {}
