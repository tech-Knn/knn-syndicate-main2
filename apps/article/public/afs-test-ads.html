<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AFS Test: /search-style ads (baseline)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:700px;margin:2rem auto;padding:0 1rem}
h1{font-size:20px} pre{background:#f4f4f4;padding:.5rem;overflow:auto;font-size:12px}
#afscontainer1{border:2px dashed #888;padding:.5rem;min-height:80px;margin:1rem 0}
#log{background:#111;color:#0f0;font:12px monospace;padding:.5rem;min-height:60px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>AFS Baseline Test — <code>_googCsa('ads', ...)</code></h1>
<p>Uses the <em>exact minimal params</em> that <code>/search?q=used+cars</code> sends. If <strong>ads render below</strong>, the pubId+styleId are healthy for the <code>ads</code> command.</p>

<div id="afscontainer1"></div>

<h2>adLoadedCallback log:</h2>
<div id="log">waiting for Google response...</div>

<pre id="params"></pre>

<script>
(function(g,o){g[o]=g[o]||function(){(g[o].q=g[o].q||[]).push(arguments)};g[o].t=1*new Date})(window,'_googCsa');

var po = {
  pubId: 'partner-pub-6567805284657549',
  styleId: '7465600436',
  query: 'used cars',
  hl: 'en',
  adsafe: 'medium',
  ivt: false,
  linkTarget: '_blank',
  resultsPageQueryParam: 'q',
  resultsPageBaseUrl: window.location.origin + '/search',
  adtest: 'on'
};
document.getElementById('params').textContent = 'Sent to Google:\n' + JSON.stringify(po, null, 2);

_googCsa('ads', po, {
  container: 'afscontainer1',
  number: 3,
  adLoadedCallback: function(c, loaded) {
    document.getElementById('log').textContent =
      '[' + new Date().toISOString() + '] container=' + c + ' adsLoaded=' + loaded;
  }
});

var s = document.createElement('script');
s.async = true;
s.src = 'https://www.google.com/adsense/search/ads.js';
document.head.appendChild(s);
</script>
</body>
</html>
