# Cloudflare Worker config for the edge redirect engine (Phase 7).
#
# One-time provisioning (needs the Cloudflare account that holds the zone):
#   1. wrangler kv namespace create REDIRECTS      → paste the id below
#   2. set ARTICLE_FALLBACK to the approved article domain
#   3. uncomment + set the route to the redirect host (go.<approved-domain>)
#   4. wrangler deploy
name = "knn-redirect"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
workers_dev = false

# KV holding redirect:{redirectId} configs, write-through-synced from the origin.
[[kv_namespaces]]
binding = "REDIRECTS"
id = "0480a994b3e1469cb3d9fc966139ad41"

[vars]
ARTICLE_FALLBACK = "https://articles.10linesabout.com/"
# Cloak ad-id verification. ENFORCE (per operator decision): a paid click must carry kaid={{ad.id}}
# matching the ad's stored id, or it goes to the white page. NOTE: observe showed a non-zero
# "macro missing" count — those clicks now route to white (accepted tradeoff). Revert = set "observe"
# + `pnpm dlx wrangler deploy`.
CLOAK_VERIFY_MODE = "enforce"
# Beacon each decision to the API so the split is visible. Empty disables telemetry.
CLOAK_TELEMETRY_URL = "https://app.staging.rsoc.app/api/telemetry/cloak"
# CLOAK_TOKEN_SECRET is NOT set here (a secret must never be committed). Set it out-of-band, the
# SAME value the article uses, so the money 302 carries an opaque `?t=` instead of plaintext params:
#   cd apps/redirect && pnpm dlx wrangler secret put CLOAK_TOKEN_SECRET
# Unset → the Worker emits the legacy plaintext Location (current behavior). Deploy the token-aware
# article (observe) BEFORE setting this, so a token-only 302 always meets an article that can decode it.

# Custom domain for the redirect host. `custom_domain = true` provisions ONLY this
# hostname's DNS + cert on Cloudflare (scoped to `go` — root/www/articles untouched).
[[routes]]
pattern = "go.10linesabout.com"
custom_domain = true
