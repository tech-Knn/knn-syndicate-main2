# Cloudflare Worker config for the edge redirect engine (Phase 7).
#
# One-time provisioning (needs the Cloudflare account that holds the zone):
#   1. wrangler kv namespace create REDIRECTS      → paste the id below
#   2. set ARTICLE_FALLBACK to the approved article domain
#   3. uncomment + set the route to the redirect host (go.<approved-domain>)
#   4. wrangler deploy
name = "knn-redirect"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
workers_dev = false

# KV holding redirect:{redirectId} configs, write-through-synced from the origin.
[[kv_namespaces]]
binding = "REDIRECTS"
id = "0480a994b3e1469cb3d9fc966139ad41"

[vars]
ARTICLE_FALLBACK = "https://articles.10linesabout.com/"
# Cloak ad-id verification: start in OBSERVE (route unchanged, only measure money-vs-white +
# macro-hit rate). Flip to "enforce" ONLY after the stats prove real clicks carry {{ad.id}}.
CLOAK_VERIFY_MODE = "observe"
# Beacon each decision to the API so the split is visible. Empty disables telemetry.
CLOAK_TELEMETRY_URL = "https://app.staging.rsoc.app/api/telemetry/cloak"

# Custom domain for the redirect host. `custom_domain = true` provisions ONLY this
# hostname's DNS + cert on Cloudflare (scoped to `go` — root/www/articles untouched).
[[routes]]
pattern = "go.10linesabout.com"
custom_domain = true
